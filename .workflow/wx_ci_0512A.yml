version: '1.0'
name: wx_ci_0512A
displayName: 微信小程序自动构建上传
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - ''
variables:
  WX_APPID: ${WX_APPID}
  WX_PRIVATE_KEY: ${WX_PRIVATE_KEY}
  WECOM_WEBHOOK: ${WECOM_WEBHOOK}
stages:
  - name: build
    displayName: 构建发布
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_nodejs
        displayName: Nodejs 构建
        nodeVersion: 24.5.0
        commands:
          - '# 设置NPM源，提升安装速度'
          - npm config set registry https://registry.npmmirror.com
          - ''
          - '# 执行编译命令'
          - npm install && npm run build:weapp
          - ''
          - '# 安装小程序相关工具'
          - npm install miniprogram-ci qrcode axios --save
          - ''
          - '# 发布'
          - node scripts/ci-publish.js
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./dist
        caches:
          - ~/.npm
          - ~/.yarn
        notify: []
        strategy:
          retry: '0'
