name: 微信小程序自动构建发布

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 编译小程序
        run: npm run build:weapp

      - name: 安装CI工具
        run: npm install miniprogram-ci qrcode axios --save

      - name: 上传体验版 + 推送企微
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          GITEE_REF: ${{ gitee.ref }}
          GITEE_COMMIT_MSG: ${{ gitee.head_commit.message }}
        run: node scripts/ci-publish.js
